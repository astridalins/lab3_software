<!DOCTYPE html>
<html lang=en>

<head>
	<meta charset="UTF-8">
	<link rel="icon" href="assets/upf.png">
	<title> U </title>
	<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
	<link rel="stylesheet" href="https://www.w3schools.com/w3css/5/w3.css">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
	<link rel="stylesheet" href="css/style.css">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<script>
		window.App = window.App || {};
		App.Errors = App.Errors || {};
	</script>
	<script src="js/LoginValidation.js"></script>
	<script src="js/RegisterValidation.js"></script>

	<script>
		App.currentPage = '';

		App.highlightMenu = function (href) {
			$(".menu").removeClass("w3-white");
			if (href) $(".menu[href='" + href + "']").addClass("w3-white");
		};

		App.init = function () {

			$.ajaxSetup({ cache: false });
			$('#navigation').load("Menu");
			$('#content').load("Content");
			$('#lcolumn').html('');
			$('#rcolumn').html('');
			App.bindEvents();

		};

		App.bindEvents = function () {

			// Menu clicks
			$(document).on("click", ".menu", function (event) {
				event.preventDefault();
				App.currentPage = $(this).attr('href');
				App.currentTab  = 'privat';  // reset tab memory on page change
				$('#lcolumn').html('');
				$('#rcolumn').html('');
				$('#content').load(App.currentPage, function () {
					$('#navigation').load("Menu", function () {
						App.highlightMenu(App.currentPage);
					});
				});
			});

			/* Track which MainPage tab is active */
			$(document).on("click", ".tab-btn", function () {
				App.currentTab = this.id.replace('btn-', '');
			});

			// Form submission via AJAX (Register, Login…)
			$(document).on("submit", "form", function (event) {
				event.preventDefault();
				const form = this;
				const data = new FormData(form);
				$.ajax({
					type: 'POST',
					enctype: 'multipart/form-data',
					url: $(form).attr('action'),
					data: data,
					processData: false,
					contentType: false
				}).done(function (html) {
					$('#navigation').load("Menu", function () {
						App.highlightMenu(App.currentPage);
					});
					$("#content").html(html);
				});
			});

			/* Follow user (UsersSearch) */
			$(document).on("click", ".followUser", function (event) {
				event.preventDefault();
				$.post("Follow", { id: $(this).closest("[id]").attr("id") }, function () {
					$("#content").load("UsersSearch");
				});
			});

			/* View user profile (UsersSearch — logged in) */
			$(document).on("click", ".viewProfile", function (event) {
				event.preventDefault();
				const uid = $(this).data("uid");
				$("#content").load("ViewUserProfile?uid=" + uid);
			});

			/* View user profile (AnonUsersSearch — anonymous) */
			$(document).on("click", ".anonViewProfile", function (event) {
				event.preventDefault();
				const uid = $(this).data("uid");
				$("#content").load("ViewUserProfile?uid=" + uid);
			});

			/* Unfollow user (UsersSearch) */
			$(document).on("click", ".unfollowUser", function (event) {
				event.preventDefault();
				$.post("Unfollow", { id: $(this).closest("[id]").attr("id") }, function () {
					$("#content").load("UsersSearch");
				});
			});

			/* Show filename when image is selected */
			$(document).on("change", ".postImage", function () {
				const name = this.files[0] ? this.files[0].name : '';
				$(this).closest(".post-creator").find(".imageFileName").text(name);
			});

			/* Submit post from any forum tab (MainPage) */
			$(document).on("click", ".submitPost", function (event) {
				event.preventDefault();
				const btn       = $(this);
				const txId      = btn.data("textarea");
				const content   = $("#" + txId).val().trim();
				const creator   = btn.closest(".post-creator");
				const fileInput = creator.find(".postImage")[0];
				const hasImage  = fileInput && fileInput.files && fileInput.files.length > 0;

				if (!content && !hasImage) return;

				const fd = new FormData();
				fd.append("content",    content);
				fd.append("visibility", "" + btn.data("visibility"));
				if (hasImage) fd.append("image", fileInput.files[0]);
				const collaInput = document.getElementById("collaTarget");
				if (collaInput && collaInput.value) fd.append("collaTarget", collaInput.value);

				btn.prop("disabled", true).text("Publicant...");

				$.ajax({
					type        : "POST",
					url         : "AddPost",
					data        : fd,
					processData : false,
					contentType : false,
					success: function (resp) {
						btn.prop("disabled", false).html('<i class="fa fa-send"></i> Publicar');
						if ((resp || "").trim() === "ok") {
							$("#" + txId).val("");
							creator.find(".imageFileName").text("");
							if (fileInput) fileInput.value = "";
							const tab = App.currentTab || 'privat';
							$("#content").load("MainPage", function () {
								if (typeof showTab === 'function') showTab(tab);
							});
						}
					},
					error: function (xhr) {
						btn.prop("disabled", false).html('<i class="fa fa-send"></i> Publicar');
						console.error("AddPost error", xhr.status, xhr.responseText);
					}
				});
			});

			/* Delete post — reloads page, or refreshes reply thread if inside replies-container */
			$(document).on("click", ".delPost", function (event) {
				event.preventDefault();
				const btn             = $(this);
				const replyContainer  = btn.closest(".replies-container");
				const postId          = btn.closest("[id]").attr("id");
				const tab             = App.currentTab || 'privat';

				$.post("DelPost", { id: postId }, function () {
					if (replyContainer.length) {
						// It's a reply inside an open thread — reload just the replies
						const parentCard = replyContainer.closest("[id]");
						const parentId   = parentCard.attr("id");
						replyContainer.load("GetReplies?postId=" + parentId, function () {
							const countSpan = parentCard.find(".replyCountText");
							countSpan.text(Math.max(0, parseInt(countSpan.text() || "0") - 1));
						});
					} else {
						const page = (App.currentPage === "Profile") ? "Profile" : "MainPage";
						$("#content").load(page, function () {
							if (page === 'MainPage' && typeof showTab === 'function') showTab(tab);
						});
					}
				});
			});

			/* Toggle replies section on a post */
			$(document).on("click", ".toggleReplies", function (event) {
				event.preventDefault();
				const btn       = $(this);
				const card      = btn.closest("[id]");
				const container = card.find(".replies-container");
				if (container.is(":visible")) {
					container.hide();
					return;
				}
				if (container.children().length === 0) {
					const postId = btn.data("postid");
					container.load("GetReplies?postId=" + postId, function () {
						container.show();
					});
				} else {
					container.show();
				}
			});

			/* Submit reply inside an open replies section */
			$(document).on("click", ".submitReply", function (event) {
				event.preventDefault();
				const btn       = $(this);
				const composer  = btn.closest(".reply-composer");
				const container = btn.closest(".replies-container");
				const postId    = composer.find(".replyParentId").val();
				const content   = composer.find(".replyText").val().trim();
				if (!content) return;

				btn.prop("disabled", true).html('<i class="fa fa-spinner fa-spin"></i>');

				const fd = new FormData();
				fd.append("content",  content);
				fd.append("visibility", "0");
				fd.append("parentId", postId);

				$.ajax({
					type: "POST", url: "AddPost", data: fd,
					processData: false, contentType: false,
					success: function (resp) {
						btn.prop("disabled", false).html('<i class="fa fa-reply"></i> Respondre');
						if ((resp || "").trim() === "ok") {
							composer.find(".replyText").val("");
							container.load("GetReplies?postId=" + postId, function () {
								// Update count badge
								const parentCard = container.closest("[id]");
								const countSpan  = parentCard.find(".replyCountText");
								countSpan.text(parseInt(countSpan.text() || "0") + 1);
							});
						}
					},
					error: function () {
						btn.prop("disabled", false).html('<i class="fa fa-reply"></i> Respondre');
					}
				});
			});

			/* Admin: delete user from UsersManagement */
			$(document).on("click", ".deleteUser", function (event) {
				event.preventDefault();
				const uid  = $(this).data("uid");
				const name = $(this).data("name");
				if (!confirm('Segur que vols eliminar l\'usuari "' + name + '"?\nAquesta acció eliminarà també tots els seus posts i dades.')) return;
				const btn = $(this);
				btn.prop("disabled", true);
				$.post("DeleteUser", { id: uid }, function (resp) {
					if ((resp || "").trim() === "ok") {
						$("#user-row-" + uid).fadeOut(300, function () { $(this).remove(); });
					} else {
						btn.prop("disabled", false);
						alert("Error en eliminar l'usuari.");
					}
				});
			});

			/* Show inline post editor */
			$(document).on("click", ".editPost", function (event) {
				event.preventDefault();
				const card    = $(this).closest("[id]");
				const textEl  = card.find(".post-text");
				const editBox = card.find(".post-edit-box");
				editBox.find("textarea").val(textEl.text().trim());
				textEl.hide();
				editBox.show();
			});

			/* Cancel inline edit */
			$(document).on("click", ".cancelEdit", function (event) {
				event.preventDefault();
				const card = $(this).closest("[id]");
				card.find(".post-edit-box").hide();
				card.find(".post-text").show();
			});

			/* Save inline edit */
			$(document).on("click", ".saveEdit", function (event) {
				event.preventDefault();
				const btn     = $(this);
				const card    = btn.closest("[id]");
				const postId  = card.attr("id");
				const content = card.find(".post-edit-box textarea").val().trim();
				if (!content) return;
				btn.prop("disabled", true).text("Guardant...");
				$.post("EditPost", { id: postId, content: content }, function (resp) {
					btn.prop("disabled", false).html('<i class="fa fa-save"></i> Guardar');
					if ((resp || "").trim() === "ok") {
						card.find(".post-text").text(content).show();
						card.find(".post-edit-box").hide();
					}
				});
			});

			/* Save profile edits — url-encoded (no multipart needed) */
			$(document).on("click", ".saveProfile", function (event) {
				event.preventDefault();
				$.ajax({
					type: "POST",
					url: "UpdateProfile",
					data: $("#editProfileForm").serialize()
				}).done(function () {
					$("#content").load("Profile");
				}).fail(function (xhr) {
					try {
						const errors = JSON.parse(xhr.responseText);
						Object.keys(errors).forEach(function (key) {
							$("#err-" + key).text(errors[key]);
						});
					} catch (e) {}
				});
			});

			/* ── DIADES ────────────────────────────────────────────────── */

			/* Open create-diada modal */
			$(document).on("click", "#openCreateDiadaBtn", function () {
				$("#createDiadaModal").css("display", "flex");
			});

			/* Close modal */
			$(document).on("click", "#closeDiadaModal, #cancelDiadaBtn", function () {
				$("#createDiadaModal").hide();
				var f = document.getElementById("createDiadaForm");
				if (f) f.reset();
			});

			/* Submit new diada */
			$(document).on("click", "#submitDiadaBtn", function () {
				var btn  = $(this).prop("disabled", true);
				var data = $("#createDiadaForm").serialize();
				$.post("CreateDiada", data, function (resp) {
					btn.prop("disabled", false);
					if ((resp || "").trim() === "ok") {
						$("#createDiadaModal").hide();
						document.getElementById("createDiadaForm").reset();
						$("#content").load("Eventos");
					}
				}).fail(function () { btn.prop("disabled", false); });
			});

			/* Delete diada */
			$(document).on("click", ".deleteDiada", function () {
				var id   = $(this).data("id");
				var name = $(this).data("name");
				if (!confirm('Segur que vols eliminar la diada "' + name + '"?')) return;
				var btn = $(this).prop("disabled", true);
				$.post("DeleteDiada", { id: id }, function (resp) {
					if ((resp || "").trim() === "ok") {
						$("#content").load("Eventos");
					} else {
						btn.prop("disabled", false);
					}
				});
			});

			/* Submit star rating */
			$(document).on("click", ".submitRating", function () {
				var diadaId = $(this).data("diada");
				var value   = parseInt($("#ratingValue").val() || "0", 10);
				if (!value || value < 1 || value > 5) {
					alert("Selecciona una valoració entre 1 i 5 estrelles.");
					return;
				}
				var btn = $(this).prop("disabled", true);
				$.post("SubmitRating", { diadaId: diadaId, value: value }, function (resp) {
					resp = (resp || "").trim();
					if (resp === "ok") {
						$("#content").load("Eventos?diadaId=" + diadaId);
					} else {
						btn.prop("disabled", false);
						if (resp === "noauth")          alert("Has d'estar identificat com a casteller per valorar.");
						else if (resp === "notauthorized") alert("Només poden valorar els membres de les colles participants.");
						else if (resp === "alreadyreviewed") alert("Ja has valorat aquesta diada.");
						else                            alert("Error en enviar la valoració.");
					}
				}).fail(function () { btn.prop("disabled", false); });
			});

			/* Like / Unlike toggle (MainPage) */
			$(document).on("click", ".likeToggle", function (event) {
				event.preventDefault();
				const btn    = $(this);
				const postId = btn.closest("[id]").attr("id");
				const liked  = btn.attr("data-liked") === "1";
				const url    = liked ? "UnlikePost" : "LikePost";
				$.post(url, { id: postId }, function (newCount) {
					btn.find(".likeCount").text(newCount);
					btn.attr("data-liked", liked ? "0" : "1");
					btn.toggleClass("w3-blue w3-light-grey");
				});
			});
		};

		App.stack = function () {
			$("#stack").toggleClass("w3-show");
		};

		// Ensure `App.init` runs correctly
		$(document).ready(function () {
			App.init();
		});

	</script>

</head>

<body>

	<!-- Begin Navigation -->
	<div class="w3-theme w3-top" id="navigation"> </div>
	<!-- End Navigation -->

	<!-- Begin Content -->
	<div class="w3-row-padding" style="margin-top: 50px;margin-bottom: 75px">

		<!-- Left Column -->
		<div class="w3-container w3-col m3 w3-hide-small">
			<div id="lcolumn"> </div>
		</div>
		<!-- Middle Column -->
		<div class="w3-container w3-col m12" id="contentContainer">
			<div id="content"> </div>
		</div>
		<!-- Right Column -->
		<div class="w3-container w3-col m3 w3-hide-small">
			<div id="rcolumn"> </div>
		</div>

	</div>
	<!-- End Content -->
	<!-- Footer -->
	<footer class="w3-theme w3-bottom"
	        style="display:flex; align-items:center; justify-content:space-between;
	               padding:8px 20px; min-height:80px;">
		<p style="margin:0">Pompeu Fabra University @2026</p>
		<img src="assets/xaneta.jpeg" alt="Xaneta"
		     style="width:64px; height:64px; border-radius:50%; object-fit:cover;
		            box-shadow:0 2px 8px rgba(0,0,0,0.4);">
	</footer>

</body>

</html>
